AWSTemplateFormatVersion: "2010-09-09"
Description: "MCGSE Web-GIS Infrastructure: S3, CloudFront, ECS Fargate, ALB, and EFS Storage"

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where ECS and ALB will be deployed
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for ECS Tasks and ALB
  DomainName:
    Type: String
    Default: "gis.example.com"
    Description: Domain name for the application

Resources:
  # 1. Frontend S3 Bucket for Static Assets
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "mcgse-frontend-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # 2. CloudFront Origin Access Control (OAC)
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: "MCGSE-Frontend-OAC"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 3. Elastic File System (EFS) for Spatial Knowledge Package (.gdb)
  SpatialKnowledgeEFS:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting

  # 4. Application Load Balancer for Backend API
  BackendALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: "mcgse-backend-alb"
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      Type: application

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: "mcgse-backend-tg"
      Port: 8000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /api/v1/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup
      LoadBalancerArn: !Ref BackendALB
      Port: 80
      Protocol: HTTP

  # 5. CloudFront Unified Distribution (SPA frontend + /api/* route to ALB)
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: "Unified MCGSE Web-GIS CloudFront CDN"
        DefaultRootObject: "index.html"
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
          - Id: BackendALBOrigin
            DomainName: !GetAtt BackendALB.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        # Route all /api/* requests directly to FastAPI Backend ALB (Zero CORS!)
        CacheBehaviors:
          - PathPattern: "/api/*"
            TargetOriginId: BackendALBOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            ForwardedValues:
              QueryString: true
              Headers: ["*"]
              Cookies:
                Forward: all
            DefaultTTL: 0
            MinTTL: 0
            MaxTTL: 0
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: "/index.html"
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: "/index.html"

Outputs:
  CloudFrontURL:
    Description: "Public URL for the MCGSE Web-GIS platform"
    Value: !GetAtt CloudFrontDistribution.DomainName
  BackendALBDNS:
    Description: "Direct DNS of the Backend ALB"
    Value: !GetAtt BackendALB.DNSName
  EFSFileSystemId:
    Description: "EFS ID for mounting Spatial Knowledge Package"
    Value: !Ref SpatialKnowledgeEFS
