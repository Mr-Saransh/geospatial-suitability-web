services:
  # 1. FastAPI Web-GIS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mcgse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SPATIAL_KNOWLEDGE_ROOT=/app/data/Himachal_Pradesh_Spatial_Knowledge.gdb
      - FLOOD_SPATIAL_KNOWLEDGE_ROOT=/app/data/Himachal_Pradesh_Spatial_Knowledge.gdb
      - LANDSLIDE_SPATIAL_KNOWLEDGE_ROOT=/app/data/Himachal_Pradesh_Spatial_Knowledge.gdb
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1,http://localhost:5173
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b
      - OLLAMA_TIMEOUT=30.0
      - AI_RATE_LIMIT_PER_MINUTE=30
    volumes:
      # Mount the Spatial Knowledge Package directory from host or persistent volume
      - ./backend/data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mcgse-network

  # 2. React SPA Frontend (Nginx Reverse Proxy)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: mcgse-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mcgse-network

  # 3. Optional Local Ollama AI Engine (Run with: docker compose --profile with-ai up)
  ollama:
    image: ollama/ollama:latest
    container_name: mcgse-ollama
    restart: unless-stopped
    profiles:
      - with-ai
    # Bind strictly to host loopback to prevent exposing Ollama to the public network
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - mcgse-network

networks:
  mcgse-network:
    driver: bridge

volumes:
  ollama-models:
    name: mcgse-ollama-models
